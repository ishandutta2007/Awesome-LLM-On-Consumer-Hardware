<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="45%" stop-color="#0D1127" />
      <stop offset="100%" stop-color="#05070F" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="35%" stop-color="#818CF8" />
      <stop offset="70%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#F472B6" />
    </linearGradient>

    <linearGradient id="glow-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glow-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="pill-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.6" />
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="orb-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60" />
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(0.5deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(7px) rotate(-0.5deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes dashFlow {
        from { stroke-dashoffset: 240; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes textShimmer {
        0% { stop-color: #38BDF8; }
        25% { stop-color: #818CF8; }
        50% { stop-color: #F472B6; }
        75% { stop-color: #34D399; }
        100% { stop-color: #38BDF8; }
      }
      .anim-float-1 { animation: floatSlow 6s ease-in-out infinite; }
      .anim-float-2 { animation: floatReverse 7s ease-in-out infinite; }
      .anim-pulse { animation: pulseGlow 5s ease-in-out infinite; }
      .anim-dash {
        stroke-dasharray: 8, 8;
        animation: dashFlow 8s linear infinite;
      }
      .anim-dash-fast {
        stroke-dasharray: 6, 6;
        animation: dashFlow 4s linear infinite;
      }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="380" rx="16" fill="url(#bg-grad)" />

  <!-- Background Cyber Grid -->
  <g opacity="0.08" stroke="#94A3B8" stroke-width="1">
    <line x1="0" y1="40" x2="1200" y2="40" />
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="190" x2="1200" y2="190" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="290" x2="1200" y2="290" />
    <line x1="0" y1="340" x2="1200" y2="340" />
    <line x1="80" y1="0" x2="80" y2="380" />
    <line x1="200" y1="0" x2="200" y2="380" />
    <line x1="320" y1="0" x2="320" y2="380" />
    <line x1="440" y1="0" x2="440" y2="380" />
    <line x1="560" y1="0" x2="560" y2="380" />
    <line x1="680" y1="0" x2="680" y2="380" />
    <line x1="800" y1="0" x2="800" y2="380" />
    <line x1="920" y1="0" x2="920" y2="380" />
    <line x1="1040" y1="0" x2="1040" y2="380" />
    <line x1="1140" y1="0" x2="1140" y2="380" />
  </g>

  <!-- Ambient Dynamic Glowing Orbs (Behind Foreground Content) -->
  <g class="anim-pulse" style="transform-origin: 200px 100px;">
    <circle cx="180" cy="90" r="140" fill="url(#glow-cyan)" filter="url(#orb-blur)" />
  </g>
  <g class="anim-pulse" style="transform-origin: 1020px 280px; animation-delay: -2.5s;">
    <circle cx="1020" cy="280" r="160" fill="url(#glow-purple)" filter="url(#orb-blur)" />
  </g>

  <!-- Tech Geometric Circuit Flows in Background -->
  <g opacity="0.35">
    <!-- Stream 1 -->
    <path d="M 50,70 L 220,70 L 270,120 L 480,120" fill="none" stroke="#38BDF8" stroke-width="1.8" class="anim-dash" />
    <circle cx="50" cy="70" r="3.5" fill="#38BDF8" />
    <circle cx="480" cy="120" r="3.5" fill="#818CF8" />

    <!-- Stream 2 -->
    <path d="M 720,260 L 920,260 L 980,310 L 1150,310" fill="none" stroke="#C084FC" stroke-width="1.8" class="anim-dash-fast" />
    <circle cx="720" cy="260" r="3.5" fill="#818CF8" />
    <circle cx="1150" cy="310" r="3.5" fill="#F472B6" />

    <!-- Stream 3 (Top right hardware bus) -->
    <path d="M 880,50 L 1020,50 L 1060,90 L 1160,90" fill="none" stroke="#34D399" stroke-width="1.5" class="anim-dash" />
    <circle cx="880" cy="50" r="3" fill="#34D399" />
    <circle cx="1160" cy="90" r="3" fill="#38BDF8" />
  </g>

  <!-- Floating Dynamic Hardware Architecture Pills (Background / Midground) -->
  <g class="anim-float-1" opacity="0.85">
    <!-- Chip 1: VRAM & Architecture -->
    <g transform="translate(70, 275)">
      <rect width="195" height="42" rx="21" fill="url(#pill-grad)" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.5" />
      <circle cx="22" cy="21" r="7" fill="#38BDF8" />
      <text x="38" y="26" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">⚡ 4-bit to 8-bit GGUF</text>
    </g>

    <!-- Chip 2: Apple Silicon / RTX -->
    <g transform="translate(940, 65)">
      <rect width="190" height="42" rx="21" fill="url(#pill-grad)" stroke="#C084FC" stroke-width="1.2" stroke-opacity="0.5" />
      <circle cx="22" cy="21" r="7" fill="#C084FC" />
      <text x="38" y="26" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">🎮 RTX • Metal • Vulkan</text>
    </g>
  </g>

  <g class="anim-float-2" opacity="0.85">
    <!-- Chip 3: 100% Private -->
    <g transform="translate(945, 275)">
      <rect width="185" height="42" rx="21" fill="url(#pill-grad)" stroke="#34D399" stroke-width="1.2" stroke-opacity="0.5" />
      <circle cx="22" cy="21" r="7" fill="#34D399" />
      <text x="38" y="26" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">🔒 100% Offline &amp; Private</text>
    </g>

    <!-- Chip 4: Llama 3 / DeepSeek / Mistral -->
    <g transform="translate(70, 65)">
      <rect width="190" height="42" rx="21" fill="url(#pill-grad)" stroke="#F472B6" stroke-width="1.2" stroke-opacity="0.5" />
      <circle cx="22" cy="21" r="7" fill="#F472B6" />
      <text x="38" y="26" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">🧠 1B - 70B Local Models</text>
    </g>
  </g>

  <!-- Central Foreground Content Container -->
  <g transform="translate(600, 190)" text-anchor="middle">
    <!-- Category Badge -->
    <g transform="translate(-170, -118)">
      <rect width="340" height="32" rx="16" fill="#0F172A" stroke="url(#primary-grad)" stroke-width="1.2" />
      <circle cx="20" cy="16" r="5" fill="#34D399" />
      <text x="175" y="21" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">AWESOME ON-DEVICE AI ECOSYSTEM</text>
    </g>

    <!-- Primary Title -->
    <text y="-32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#primary-grad)" filter="url(#soft-glow)" letter-spacing="-0.5">
      Awesome LLM On Consumer Hardware
    </text>

    <!-- Subtitle Line 1 -->
    <text y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#E2E8F0" letter-spacing="0.2">
      Curated Directory of Local Inference, Quantized Model Serving &amp; Edge Hardware Runtimes
    </text>

    <!-- Subtitle Line 2 / Feature highlights -->
    <text y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#94A3B8" letter-spacing="0.3">
      Run Llama 3, DeepSeek, Qwen &amp; Mistral on Everyday Mac, PC, Laptops &amp; Edge Single-Board Devices
    </text>

    <!-- Metrics / Tags Row -->
    <g transform="translate(0, 80)">
      <!-- Tag 1 -->
      <g transform="translate(-270, 0)">
        <rect x="-60" y="-14" width="120" height="28" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1" />
        <text y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#38BDF8">🚀 Zero Cloud Latency</text>
      </g>
      <!-- Tag 2 -->
      <g transform="translate(-90, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1" />
        <text y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#A855F7">💸 $0 Per-Token Cost</text>
      </g>
      <!-- Tag 3 -->
      <g transform="translate(90, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1" />
        <text y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#34D399">🛡️ Air-Gapped Privacy</text>
      </g>
      <!-- Tag 4 -->
      <g transform="translate(270, 0)">
        <rect x="-60" y="-14" width="120" height="28" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1" />
        <text y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#F472B6">💻 8GB-24GB VRAM</text>
      </g>
    </g>
  </g>

  <!-- Border Frame Accent -->
  <rect x="1.5" y="1.5" width="1197" height="377" rx="15" fill="none" stroke="url(#primary-grad)" stroke-width="1.5" stroke-opacity="0.35" />
</svg>
